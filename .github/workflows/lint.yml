name: Lint

on:
  workflow_dispatch:
  push:
    paths:
      - '!.dist/**'
  pull_request:
    paths:
      - '!.dist/**'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint
